<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sign In - Tesla Plex Player</title>
  <meta name="theme-color" content="#0c0d10">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .login-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #191c24 0%, #0c0d10 80%);
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 480px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .login-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
    }

    .login-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .login-logo svg {
      color: var(--accent);
    }

    .login-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .login-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .token-input {
      width: 100%;
      height: 54px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 48px 0 16px;
      font-size: 1rem;
      color: var(--text-main);
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .token-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
      background: var(--bg-surface);
    }

    .toggle-visibility-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toggle-visibility-btn:hover {
      color: var(--text-main);
    }

    .login-btn {
      width: 100%;
      height: 54px;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      background: var(--accent);
      color: #000;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      font-family: inherit;
    }

    .login-btn:hover {
      background: var(--accent-hover);
    }

    .login-btn:active {
      transform: scale(0.98);
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .login-error-banner {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--danger);
      color: #fca5a5;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      display: none;
      align-items: center;
      gap: 10px;
    }

    .login-help {
      font-size: 0.82rem;
      color: var(--text-dim);
      text-align: center;
      line-height: 1.4;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
          </svg>
          <span>PLEXAMP</span>
          <span class="brand-badge">TESLA</span>
        </div>
        <h1 class="login-title">Sign In</h1>
        <p class="login-subtitle">Enter your Plex token to access your music library in-car.</p>
      </div>

      <div id="login-error" class="login-error-banner" role="alert">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span id="error-message">Invalid token or unauthorized account</span>
      </div>

      <form id="login-form" class="login-form">
        <div class="input-wrap">
          <input
            type="password"
            id="token-input"
            class="token-input"
            placeholder="Paste Plex Token (X-Plex-Token)"
            required
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            aria-label="Plex Token"
          >
          <button type="button" id="toggle-pwd-btn" class="toggle-visibility-btn" aria-label="Toggle Token Visibility" title="Show/Hide Token">
            <svg id="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg id="icon-eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>

        <button type="submit" id="submit-btn" class="login-btn">
          <span id="btn-text">Sign In</span>
          <div id="btn-spinner" class="spinner" style="width: 20px; height: 20px; border-width: 2px; border-color: #000; border-top-color: transparent; display: none;"></div>
        </button>
      </form>

      <div class="login-help">
        <strong>Where to find your token:</strong> In Plex Web, click <strong>...</strong> on any track &rarr; <strong>Get Info</strong> &rarr; <strong>View XML</strong>. Look at the end of the URL for <code>X-Plex-Token=...</code>.
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const tokenInput = document.getElementById('token-input');
    const togglePwdBtn = document.getElementById('toggle-pwd-btn');
    const iconEye = document.getElementById('icon-eye');
    const iconEyeOff = document.getElementById('icon-eye-off');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const errorBanner = document.getElementById('login-error');
    const errorMessage = document.getElementById('error-message');

    // Show/Hide token password masking
    togglePwdBtn.addEventListener('click', () => {
      const isPwd = tokenInput.type === 'password';
      tokenInput.type = isPwd ? 'text' : 'password';
      iconEye.style.display = isPwd ? 'none' : 'block';
      iconEyeOff.style.display = isPwd ? 'block' : 'none';
    });

    function showError(msg) {
      errorMessage.textContent = msg || 'Invalid token or unauthorized account';
      errorBanner.style.display = 'flex';
    }

    function hideError() {
      errorBanner.style.display = 'none';
    }

    function setLoading(loading) {
      submitBtn.disabled = loading;
      btnText.style.display = loading ? 'none' : 'inline';
      btnSpinner.style.display = loading ? 'inline-block' : 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const token = tokenInput.value.trim();
      if (!token) return;

      hideError();
      setLoading(true);

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ token })
        });

        const data = await res.json().catch(() => ({}));

        if (res.ok && data.success) {
          // Redirect to main player
          window.location.href = '/';
        } else {
          showError(data.error || 'Invalid token or unauthorized account');
        }
      } catch (err) {
        showError('Connection error. Please try again.');
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
