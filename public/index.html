<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Tesla Plex Player</title>
  <meta name="theme-color" content="#0c0d10">
  <meta name="description" content="Lightweight touch-first Plex music player for Tesla in-car browser">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Reconnecting Toast Banner -->
  <div id="reconnecting-banner" class="reconnecting-banner">
    <div class="spinner" style="width: 18px; height: 18px; border-width: 2px; border-color: #000; border-top-color: transparent;"></div>
    <span>Reconnecting to Plex...</span>
  </div>

  <!-- App Header -->
  <header class="app-header">
    <div class="brand-section">
      <div id="brand-home-btn" class="brand-logo" title="Back to Music Home">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
        </svg>
        <span>PLEXAMP</span>
        <span class="brand-badge">TESLA</span>
      </div>
    </div>

    <!-- Navigation Breadcrumbs -->
    <nav id="breadcrumbs" class="breadcrumbs" aria-label="Breadcrumb"></nav>

    <!-- Always-Visible Search Bar -->
    <div class="search-container">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="search-input" class="search-input" placeholder="Search artists, albums, tracks..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button id="search-clear-btn" class="search-clear-btn" aria-label="Clear Search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
      <button id="tab-artists" class="nav-tab-btn active" data-view="artists">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span>Artists</span>
      </button>
      <button id="tab-playlists" class="nav-tab-btn" data-view="playlists">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="8" y1="6" x2="21" y2="6"></line>
          <line x1="8" y1="12" x2="21" y2="12"></line>
          <line x1="8" y1="18" x2="21" y2="18"></line>
          <line x1="3" y1="6" x2="3.01" y2="6"></line>
          <line x1="3" y1="12" x2="3.01" y2="12"></line>
          <line x1="3" y1="18" x2="3.01" y2="18"></line>
        </svg>
        <span>Playlists</span>
      </button>
      <button id="tab-queue-header" class="nav-tab-btn" data-view="queue">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 18V5l12-2v13"></path>
          <circle cx="6" cy="18" r="3"></circle>
          <circle cx="18" cy="16" r="3"></circle>
        </svg>
        <span>Queue</span>
      </button>
    </div>

    <!-- Connection Indicator -->
    <div id="connection-indicator" class="connection-pill" title="Network status">
      <div class="status-dot"></div>
      <span id="connection-text">Online</span>
    </div>
  </header>

  <!-- Main Viewport (Artists Grid, Albums Grid, Track List, Search, etc.) -->
  <main id="main-viewport" class="main-viewport">
    <div class="state-center">
      <div class="spinner"></div>
      <div>Loading library...</div>
    </div>
  </main>

  <!-- Side Queue Drawer -->
  <aside id="queue-drawer" class="queue-drawer" aria-label="Playback Queue">
    <div class="queue-header">
      <div class="queue-header-title">Play Queue</div>
      <button id="close-queue-btn" class="control-btn" aria-label="Close Queue">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <div id="queue-list" class="queue-list"></div>
  </aside>

  <!-- Persistent Bottom Now Playing Bar -->
  <footer class="now-playing-bar" aria-label="Now Playing">
    <!-- Left: Track Details -->
    <div class="np-left">
      <img id="np-thumb" class="np-thumb" src="/api/thumb?mock=art-1" alt="Album Cover">
      <div class="np-info">
        <div id="np-title" class="np-title">No Track Selected</div>
        <div id="np-subtitle" class="np-subtitle">Select an artist or album</div>
      </div>
    </div>

    <!-- Center: Playback Controls & Scrubber -->
    <div class="np-center">
      <div class="np-controls">
        <!-- Shuffle Toggle Button -->
        <button id="btn-shuffle" class="control-btn" title="Toggle Shuffle" aria-label="Shuffle">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="16 3 21 3 21 8"></polyline>
            <line x1="4" y1="20" x2="21" y2="3"></line>
            <polyline points="21 16 21 21 16 21"></polyline>
            <line x1="15" y1="15" x2="21" y2="21"></line>
            <line x1="4" y1="4" x2="9" y2="9"></line>
          </svg>
        </button>

        <!-- Previous Track Button -->
        <button id="btn-prev" class="control-btn" title="Previous Track" aria-label="Previous Track">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="19 20 9 12 19 4 19 20"></polygon>
            <line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"></line>
          </svg>
        </button>

        <!-- Play/Pause Big Circular Button -->
        <button id="btn-play-pause" class="control-btn play-pause-btn" title="Play / Pause" aria-label="Play or Pause">
          <svg id="icon-play" width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          <svg id="icon-pause" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
            <rect x="6" y="4" width="4" height="16"></rect>
            <rect x="14" y="4" width="4" height="16"></rect>
          </svg>
        </button>

        <!-- Next Track Button -->
        <button id="btn-next" class="control-btn" title="Next Track" aria-label="Next Track">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 4 15 12 5 20 5 4"></polygon>
            <line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"></line>
          </svg>
        </button>

        <!-- Queue Drawer Toggle Button -->
        <button id="btn-queue-toggle" class="control-btn" title="Open Queue" aria-label="Queue Drawer">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <polyline points="3 6 4 7 6 5"></polyline>
            <polyline points="3 12 4 13 6 11"></polyline>
            <polyline points="3 18 4 19 6 17"></polyline>
          </svg>
        </button>
      </div>

      <!-- Scrubber Timeline -->
      <div class="np-timeline">
        <span id="time-current" class="time-label">0:00</span>
        <div class="scrubber-wrap">
          <div class="scrubber-track">
            <div id="scrubber-fill" class="scrubber-fill"></div>
          </div>
          <input type="range" id="scrubber-slider" class="scrubber-input" min="0" max="100" value="0" step="0.1" aria-label="Track progress">
        </div>
        <span id="time-total" class="time-label">0:00</span>
      </div>
    </div>

    <!-- Right: Volume & Status -->
    <div class="np-right">
      <div class="volume-wrap">
        <button id="btn-mute" class="control-btn" style="min-width: 36px; min-height: 36px;" title="Mute / Unmute" aria-label="Mute">
          <svg id="icon-vol-high" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <svg id="icon-vol-muted" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>
        <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.05" value="1" aria-label="Volume">
      </div>
      <button id="btn-logout" class="control-btn" style="min-width: 38px; min-height: 38px;" title="Log Out of Plex" aria-label="Log Out">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
    </div>
  </footer>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
