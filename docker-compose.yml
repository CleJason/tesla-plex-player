services:
  tesla-plex-player:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tesla-plex-player
    restart: unless-stopped
    ports:
      - "${PORT:-3355}:3355"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3355
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3355/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
